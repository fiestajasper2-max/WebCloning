<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MirrorForge</title>
<link rel="stylesheet" href="/style.css" />
</head>
<body>
  <main>
    <h1>MirrorForge</h1>
    <p class="sub">Paste a URL. We crawl it page-by-page, cache every asset + every API response in Blob, and let you open the mirror.</p>

    <form id="form">
      <input id="url" type="url" placeholder="https://example.com" required />
      <button type="submit">Build mirror</button>
    </form>

    <section id="job" hidden>
      <h2>Job <code id="jobId"></code></h2>
      <p id="status">starting…</p>
      <a id="open" hidden target="_blank">Open mirror →</a>
    </section>

    <h2>Recent</h2>
    <ul id="recent"></ul>
  </main>
  <script src="/app.js"></script>
</body>
</html>

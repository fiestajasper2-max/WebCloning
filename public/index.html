<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MirrorForge</title>
<link rel="stylesheet" href="/style.css" />
</head>
<body>
  <main>
    <h1>MirrorForge</h1>
    <p class="sub">Paste a URL. Get the pages, images, fonts, CSS, JS, and replayed API responses back as a local site.</p>

    <form id="form">
      <input id="url" type="url" placeholder="https://example.com" required />
      <div class="row">
        <label>Max pages <input id="maxPages" type="number" value="30" min="1" max="200" /></label>
        <button type="submit">Build mirror</button>
      </div>
    </form>

    <section id="job" hidden>
      <h2>Job <code id="jobId"></code></h2>
      <p id="status">starting…</p>
      <pre id="log"></pre>
      <a id="open" hidden target="_blank">Open mirror →</a>
    </section>

    <h2>Recent</h2>
    <ul id="recent"></ul>
  </main>
  <script src="/app.js"></script>
</body>
</html>
